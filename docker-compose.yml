# Writers Guild self-hosted — download and run:
#   curl -O https://raw.githubusercontent.com/amiantos/writers-guild/main/docker-compose.yml
#   docker compose up -d
#
# Then open http://localhost:8000 and add an API key in Settings. To require a
# password, and to invite other people, turn on signing in under Settings → Account.
#
# To update to the latest release:
#   docker compose pull && docker compose up -d

services:
  writers-guild:
    image: ghcr.io/amiantos/writers-guild:latest
    container_name: writers-guild-server
    ports:
      - '8000:8000'
    volumes:
      # All persistent state — the SQLite database, characters, images — lives
      # here. Back this directory up to back up Writers Guild.
      - ./data:/data
    environment:
      # ───── Optional: HTTP Basic Authentication ───────────────────────────
      # A password prompt in front of everything, until signing in (Settings →
      # Account) is on. On an install that already has these, the first start
      # turns signing in on with the same username and password, and then
      # they can be removed. Set both in a .env file next to this compose file:
      #   BASIC_AUTH_USERNAME=you
      #   BASIC_AUTH_PASSWORD=a-long-random-password
      # Auth is disabled when either is empty.
      - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME:-}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:-}
    restart: unless-stopped
